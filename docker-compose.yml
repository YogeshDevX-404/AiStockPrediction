version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradegenius-postgres
    restart: always
    environment:
      POSTGRES_DB: tradegenius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradegenius-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradegenius-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tradegenius?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_super_secret_key_tradegenius
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tradegenius-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
